<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Guess | Futuristic Number Game</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts for futuristic typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #050914;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(20, 184, 166, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08), transparent 25%);
            color: #e2e8f0;
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
        }

        h1, h2, .orbitron-font {
            font-family: 'Orbitron', sans-serif;
        }

        .neon-box {
            background: rgba(16, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(45, 212, 191, 0.3);
            box-shadow: 0 0 20px rgba(45, 212, 191, 0.1),
                        inset 0 0 20px rgba(45, 212, 191, 0.05);
            border-radius: 16px;
        }

        .neon-input {
            background: rgba(2, 6, 23, 0.7);
            border: 1px solid rgba(45, 212, 191, 0.5);
            box-shadow: 0 0 10px rgba(45, 212, 191, 0.2);
            color: #2dd4bf;
            transition: all 0.3s ease;
        }

        .neon-input:focus {
            outline: none;
            border-color: #2dd4bf;
            box-shadow: 0 0 15px rgba(45, 212, 191, 0.5), inset 0 0 10px rgba(45, 212, 191, 0.2);
        }

        .neon-btn {
            background: linear-gradient(90deg, #0d9488, #2dd4bf);
            color: #020617;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: none;
            box-shadow: 0 0 15px rgba(45, 212, 191, 0.4);
            transition: all 0.3s ease;
        }

        .neon-btn:hover {
            box-shadow: 0 0 25px rgba(45, 212, 191, 0.8);
            transform: translateY(-2px);
        }

        .neon-btn:active {
            transform: translateY(1px);
        }

        .terminal-output {
            background: #020617;
            border-left: 4px solid #2dd4bf;
            color: #34d399;
            min-height: 80px;
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% { border-left-color: rgba(45, 212, 191, 0.4); }
            50% { border-left-color: rgba(45, 212, 191, 1); }
            100% { border-left-color: rgba(45, 212, 191, 0.4); }
        }

        .fade-in {
            animation: fadeIn 0.4s ease-in forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glitch effect for title */
        .glitch {
            position: relative;
            color: #2dd4bf;
            text-shadow: 0 0 10px rgba(45,212,191,0.5);
        }
        
        .creator-link {
            transition: all 0.3s ease;
        }
        
        .creator-link:hover {
            color: #f472b6;
            text-shadow: 0 0 10px rgba(244, 114, 182, 0.6);
            transform: scale(1.05);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-8">

    <main class="w-full max-w-2xl mt-8 sm:mt-16 flex-grow flex flex-col items-center">
        
        <!-- Header -->
        <div class="text-center mb-10 w-full fade-in">
            <h1 class="text-4xl sm:text-5xl md:text-6xl font-black mb-2 glitch uppercase tracking-wider">
                MARD KA GAME
            </h1>
            <p class="text-teal-500/80 text-sm sm:text-base tracking-widest orbitron-font">
                // TARGET NUMBER LOCKED: 1-100 //
            </p>
        </div>

        <!-- Language Toggle -->
        <div class="flex justify-center items-center mb-8 gap-3 fade-in" style="animation-delay: 0.05s;">
            <span id="labelBn" class="text-xs font-bold text-teal-400 transition-colors tracking-widest">BENGALI</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="langToggle" class="sr-only peer" onchange="toggleLanguage()">
                <div class="w-12 h-6 bg-slate-800 border border-teal-500/50 rounded-full peer peer-checked:after:translate-x-6 peer-checked:after:border-white after:content-[''] after:absolute after:top-[1px] after:left-[1px] after:bg-teal-400 after:border-teal-200 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-teal-600 hover:shadow-[0_0_10px_rgba(45,212,191,0.5)]"></div>
            </label>
            <span id="labelHi" class="text-xs font-bold text-slate-500 transition-colors tracking-widest">HINDI</span>
        </div>

        <!-- Game Box -->
        <div class="neon-box w-full p-6 sm:p-10 fade-in" style="animation-delay: 0.1s;">
            
            <!-- Output Console -->
            <div class="mb-8">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs text-teal-600 uppercase tracking-widest font-bold">System Log</span>
                    <span id="guessCountDisplay" class="text-xs text-teal-600 font-bold">Guesses: 0</span>
                </div>
                <div id="outputConsole" class="terminal-output p-4 rounded-r-lg text-sm sm:text-base flex flex-col justify-center shadow-inner">
                    <span class="opacity-70">> Initiate sequence. Enter a number to begin...</span>
                </div>
            </div>

            <!-- Input Area -->
            <div id="inputArea" class="flex flex-col sm:flex-row gap-4 mb-4">
                <input 
                    type="number" 
                    id="guessInput" 
                    class="neon-input flex-grow px-4 py-3 rounded-lg text-lg sm:text-xl font-bold placeholder-teal-800/50 text-center sm:text-left"
                    placeholder="Number ta guess kor..."
                    min="1" max="100"
                    autocomplete="off"
                >
                <button 
                    id="guessBtn"
                    class="neon-btn px-8 py-3 rounded-lg orbitron-font text-sm sm:text-base cursor-pointer"
                    onclick="makeGuess()"
                >
                    EXECUTE
                </button>
            </div>
            
            <!-- Restart Button (Hidden initially) -->
            <button 
                id="restartBtn"
                class="hidden w-full bg-slate-800 border border-teal-500 text-teal-400 hover:bg-teal-900/30 font-bold py-3 px-4 rounded-lg transition-colors mt-4 uppercase tracking-widest orbitron-font"
                onclick="resetGame()"
            >
                REBOOT SYSTEM
            </button>
        </div>
    </main>

    <footer class="w-full max-w-2xl py-6 mt-8 flex justify-center items-center gap-3 border-t border-teal-900/50 fade-in" style="animation-delay: 0.3s;">
        <span class="text-slate-500 text-sm orbitron-font">CREATED BY</span>
        <a href="https://www.instagram.com/aax0st/?__pwa=1" target="_blank" rel="noopener noreferrer" class="creator-link flex items-center gap-2 text-slate-300 font-bold orbitron-font bg-slate-800/50 px-4 py-2 rounded-full border border-slate-700">
            <!-- Instagram SVG Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
            aax0st
        </a>
    </footer>

    <script>
        // Dictionaries for both languages
        const phrases = {
            bn: [
                "Bokachoda", "paglachoda", "gadhachoda", "bharachoda", 
                "nesachudi khankimagi", "panukhor chudi", "garchudi", 
                "Ghorachoda", "Magibaj", "Gadhachoda", "rendibaj", 
                "Nunumukho", "Pelmagi", "chotoChudi", "Bherachudi", 
                "Menatalchudi", "Nesakhor Khandibaj", "BaroBhatari", 
                "osusthochudi", "Losonmagi", "Pelchodamara", 
                "gandhuchudi", "MentalKhanki","ku Re Madarchod","chudir bhai",
                "Garmarani Randibaj","123chudi","chodonmagi","bhanchoda","balchodabichichoda"
            ],
            hi: [
                "Chutiya", "Pagalchod", "Gadhachod", "Bhadwe", 
                "Nasheedi randi", "Porn-dekhne wale", "Gandmare", 
                "Ghodachod", "Randibaaz", "Gadhachod", "Randibaaz", 
                "Lundmukhe", "Chinal", "Chutmarike", "Bhedchod", 
                "Mental chutiye", "Nasheedi randibaaz", "Chhinal", 
                "Bimar chutiye", "Lassan randi", "Gandu", 
                "Gandu chutiye", "Mental randi"
            ]
        };

        // Game State
        let num;
        let guessCount;
        let gameOver;
        let currentLang = 'bn'; // 'bn' for Bengali, 'hi' for Hindi

        function toggleLanguage() {
            const toggle = document.getElementById('langToggle');
            const labelBn = document.getElementById('labelBn');
            const labelHi = document.getElementById('labelHi');
            const input = document.getElementById('guessInput');

            if (toggle.checked) {
                currentLang = 'hi';
                labelBn.className = "text-xs font-bold text-slate-500 transition-colors tracking-widest";
                labelHi.className = "text-xs font-bold text-teal-400 transition-colors tracking-widest";
                input.placeholder = "Number guess kar...";
            } else {
                currentLang = 'bn';
                labelBn.className = "text-xs font-bold text-teal-400 transition-colors tracking-widest";
                labelHi.className = "text-xs font-bold text-slate-500 transition-colors tracking-widest";
                input.placeholder = "Number ta guess kor...";
            }
        }

        // Initialize Game
        function initGame() {
            num = Math.floor(Math.random() * 100) + 1;
            guessCount = 0;
            gameOver = false;
            
            // Reset UI
            document.getElementById('guessInput').value = '';
            document.getElementById('guessInput').disabled = false;
            document.getElementById('guessBtn').disabled = false;
            document.getElementById('inputArea').style.display = 'flex';
            document.getElementById('restartBtn').classList.add('hidden');
            document.getElementById('guessCountDisplay').innerText = `Guesses: ${guessCount}`;
            document.getElementById('outputConsole').innerHTML = `<span class="opacity-70">> Target established. Awaiting input...</span>`;
            document.getElementById('outputConsole').className = 'terminal-output p-4 rounded-r-lg text-sm sm:text-base flex flex-col justify-center shadow-inner';
            
            // Focus input
            document.getElementById('guessInput').focus();
        }

        // Allow pressing Enter to guess
        document.getElementById('guessInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                makeGuess();
            }
        });

        function makeGuess() {
            if (gameOver) return;

            const inputElement = document.getElementById('guessInput');
            const a = parseInt(inputElement.value);

            if (isNaN(a)) {
                printToConsole("> Error: Invalid input. Number de bhai.");
                return;
            }

            guessCount++;
            document.getElementById('guessCountDisplay').innerText = `Guesses: ${guessCount}`;
            
            // Select random phrase based on selected language
            const bhasaList = phrases[currentLang];
            const bhasa = bhasaList[Math.floor(Math.random() * bhasaList.length)];
            let outputText = "";

            if (a !== num) {
                // Incorrect Guess Logic (Separated by Language)
                if (currentLang === 'bn') {
                    // Bengali Logic
                    if (guessCount < 10) {
                        if (num > a) outputText = `Abe ${bhasa}, boro number de`;
                        else if (num < a) outputText = `Abe ${bhasa}, choto number de`;
                    } else if (guessCount < 20) {
                        if (num > a) outputText = `Are ${bhasa}, boro number de`;
                        else if (num < a) outputText = `Are ${bhasa}, choto number de`;
                    } else if (guessCount < 30 || guessCount < 40 || guessCount < 50) {
                        if (num > a) outputText = `Abe ${bhasa}, boro number de`;
                        else if (num < a) outputText = `Abe ${bhasa}, choto number de`;
                    } else if (guessCount < 60) {
                        if (num > a) outputText = `Abe ${bhasa}, ebar boro number de`;
                        else if (num < a) outputText = `Abe ${bhasa}, ebar choto number de`;
                    } else if (guessCount < 70) {
                        if (num > a) outputText = `Abe ${bhasa} , boro number de : `;
                        else if (num < a) outputText = `Abe ${bhasa} , choto number de : `;
                    } else if (guessCount < 80) {
                        if (num > a) outputText = `Abe ${bhasa}, Boro number de`;
                        else if (num < a) outputText = `Abe ${bhasa}, Choto number de`;
                    } else if (guessCount < 90) {
                        if (num > a) outputText = `Abe Tui BORO number de re ${bhasa}`;
                        else if (num < a) outputText = `Abe Tui CHOTO number de re ${bhasa}`;
                    } else {
                        if (num > a) outputText = `paglachoda , ${bhasa} boro number de`;
                        else if (num < a) outputText = `paglachoda , ${bhasa} choto number de`;
                    }

                    // Milestone Checks (Bengali)
                    if (guessCount === 10) outputText += `<br><span class="text-yellow-400">> Abe Bantuchoda ${guessCount} bar-eo guess korte parli na?</span>`;
                    else if (guessCount === 20) outputText += `<br><span class="text-yellow-400">> Tui sala pure gobra bara ${bhasa} ${guessCount} bar a o hoche na kobe hobe re ?</span>`;
                    else if (guessCount === 30) outputText += `<br><span class="text-yellow-400">> Tui char be ${bhasa} Tor dara hobe na</span>`;
                    else if (guessCount === 40) outputText += `<br><span class="text-yellow-400">> Abe ${guessCount} ber guess ar theke na o korte partis sala tui pura ${bhasa}</span>`;
                    else if (guessCount === 50) outputText += `<br><span class="text-yellow-400">> Ki panuKhor lok bhai Somman , lojja kichu ache bara ${bhasa}</span>`;
                    else if (guessCount === 60) outputText += `<br><span class="text-yellow-400">> Abe ${bhasa} bara bhudhi bara tor Chude geche handle mere mere Tui ja re</span>`;
                    else if (guessCount === 70) outputText += `<br><span class="text-yellow-400">> Bhai tui susto sabhabik naki bara Te kichu rog ache mathar sathe ${bhasa} ?</span>`;
                    else if (guessCount === 80) outputText += `<br><span class="text-yellow-400">> Bahi akta kotha bolbo Tui Chre de bhujhli tor dara chodao o hobe na ar number guess kora o hobe na</span>`;
                    else if (guessCount === 90) outputText += `<br><span class="text-yellow-400">> Abe Mentalchudi chudimagi Rekhe de bara hobe ni ar pala giye handel mar bara</span>`;

                } else {
                    // Hindi Logic
                    if (guessCount < 10) {
                        if (num > a) outputText = `Abe ${bhasa}, bada number de`;
                        else if (num < a) outputText = `Abe ${bhasa}, chhota number de`;
                    } else if (guessCount < 20) {
                        if (num > a) outputText = `Are ${bhasa}, bada number de`;
                        else if (num < a) outputText = `Are ${bhasa}, chhota number de`;
                    } else if (guessCount < 30 || guessCount < 40 || guessCount < 50) {
                        if (num > a) outputText = `Abe ${bhasa}, bada number de`;
                        else if (num < a) outputText = `Abe ${bhasa}, chhota number de`;
                    } else if (guessCount < 60) {
                        if (num > a) outputText = `Abe ${bhasa}, ab bada number de`;
                        else if (num < a) outputText = `Abe ${bhasa}, ab chhota number de`;
                    } else if (guessCount < 70) {
                        if (num > a) outputText = `Abe ${bhasa} , bada number de : `;
                        else if (num < a) outputText = `Abe ${bhasa} , chhota number de : `;
                    } else if (guessCount < 80) {
                        if (num > a) outputText = `Abe ${bhasa}, Bada number de`;
                        else if (num < a) outputText = `Abe ${bhasa}, Chhota number de`;
                    } else if (guessCount < 90) {
                        if (num > a) outputText = `Abe tu BADA number de re ${bhasa}`;
                        else if (num < a) outputText = `Abe tu CHHOTA number de re ${bhasa}`;
                    } else {
                        if (num > a) outputText = `Pagalchod , ${bhasa} bada number de`;
                        else if (num < a) outputText = `Pagalchod , ${bhasa} chhota number de`;
                    }

                    // Milestone Checks (Hindi)
                    if (guessCount === 10) outputText += `<br><span class="text-yellow-400">> Abe chutiye ${guessCount} baar mein bhi guess nahi kar paya?</span>`;
                    else if (guessCount === 20) outputText += `<br><span class="text-yellow-400">> Tu sala pura gobar hai ${bhasa}, ${guessCount} baar mein bhi nahi ho raha, kab hoga re?</span>`;
                    else if (guessCount === 30) outputText += `<br><span class="text-yellow-400">> Tu rehne de be ${bhasa}, Tere se nahi hoga</span>`;
                    else if (guessCount === 40) outputText += `<br><span class="text-yellow-400">> Abe ${guessCount} baar guess karne se achha karta hi nahi, sala tu pura ${bhasa} hai</span>`;
                    else if (guessCount === 50) outputText += `<br><span class="text-yellow-400">> Kaisa tharki aadmi hai bhai, Izzat sharam kuch hai ki nahi ${bhasa}</span>`;
                    else if (guessCount === 60) outputText += `<br><span class="text-yellow-400">> Abe ${bhasa} teri buddhi chud gayi hai hila hila ke, Tu ja re yaha se</span>`;
                    else if (guessCount === 70) outputText += `<br><span class="text-yellow-400">> Bhai tu theek-thaak hai ya dimaag mein koi bimari hai ${bhasa}?</span>`;
                    else if (guessCount === 80) outputText += `<br><span class="text-yellow-400">> Bhai ek baat bolu, Tu chhod de samjha, tere se kuch na hoga aur number guess karna bhi nahi hoga</span>`;
                    else if (guessCount === 90) outputText += `<br><span class="text-yellow-400">> Abe mental randi rakh de ab nahi hoga, bhaag yaha se jake hila</span>`;
                }

                printToConsole("> " + outputText);
                inputElement.value = '';
                inputElement.focus();
                
                // Shake effect on wrong guess
                const consoleEl = document.getElementById('outputConsole');
                consoleEl.style.transform = "translateX(-5px)";
                setTimeout(() => consoleEl.style.transform = "translateX(5px)", 50);
                setTimeout(() => consoleEl.style.transform = "translateX(-5px)", 100);
                setTimeout(() => consoleEl.style.transform = "translateX(0)", 150);

            } else {
                gameOver = true;
                
                if (currentLang === 'bn') {
                    // Bengali Win
                    if (guessCount === 1) outputText = `Ap Kaha the gani baba 1 bar may hi chod diya`;
                    else if (guessCount <= 5) outputText = `Ja hok ja bara aktu budhi ache ${guessCount} bare ber korechis`;
                    else if (guessCount >= 6 && guessCount <= 10) outputText = `abe bokachoda budhi ache mathy na gobor ${guessCount} bar lage`;
                    else if (guessCount >= 11 && guessCount <= 20) outputText = `Abe paglachoda Chre de Tor dara a sob hobeni ${guessCount} bar kon murkhochodar lage bhai`;
                    else if (guessCount >= 21 && guessCount <= 30) outputText = `Are Tui To kahanki choda re ${guessCount} bare korar theke na korle o parthis bara bokchod`;
                    else if (guessCount >= 31 && guessCount <= 40) outputText = `Tui je khepachoda seta ami jani bara akhne ar gar maras na ${guessCount} bar korar theke tui mute ghumiye ja`;
                    else if (guessCount >= 41 && guessCount <= 50) outputText = `Bara pala bokachoda panukhor bara pure ${bhasa} bara tui ${guessCount} bar porjonto ke wait kore be banchod`;
                    else if (guessCount >= 51 && guessCount <= 60) outputText = `Abe ${bhasa} panu dekhe Khankimagi manus bara tui akta ${guessCount} bar chudachili naki be`;
                    else if (guessCount >= 61 && guessCount <= 70) outputText = `Abe ${bhasa} manus bara tui akta ${guessCount} bar ki nesa khe korli guess`;
                    else if (guessCount >= 71 && guessCount <= 80) outputText = `Bha re ki ${bhasa} Gar bhaga Manus tui bara ki naki ${guessCount} bare guess korche`;
                    else if (guessCount >= 81 && guessCount <= 90) outputText = `Abe Tui agula bad de ${bhasa} Doctor ke dekha ${guessCount} bare korar theke mute ghumiye ja`;
                    else outputText = `Bhai Tui ki Mohanchudi re ${guessCount} bar ke kore ato bar handel o hoyto marisni bara`;
                } else {
                    // Hindi Win
                    if (guessCount === 1) outputText = `Aap kahan the gyani baba, 1 baar mein hi chod diya`;
                    else if (guessCount <= 5) outputText = `Chalo theek hai thodi buddhi toh hai, ${guessCount} baar mein nikal liya`;
                    else if (guessCount >= 6 && guessCount <= 10) outputText = `Abe chutiye buddhi hai dimaag mein ya gobar, ${guessCount} baar lag gaye`;
                    else if (guessCount >= 11 && guessCount <= 20) outputText = `Abe pagalchod chhod de tere se ye sab nahi hoga, ${guessCount} baar kis chutiye ko lagte hai bhai`;
                    else if (guessCount >= 21 && guessCount <= 30) outputText = `Are tu toh randi ki aulaad hai re, ${guessCount} baar karne se achha na hi karta bokchod`;
                    else if (guessCount >= 31 && guessCount <= 40) outputText = `Tu jo pagalchod hai wo main janta hu, yaha aur gaand mat mara, ${guessCount} baar karne se badhiya tu muth maar ke so ja`;
                    else if (guessCount >= 41 && guessCount <= 50) outputText = `Bhaag chutiye tharki pura ${bhasa} hai tu, ${guessCount} baar tak kaun wait karta hai be bhenchod`;
                    else if (guessCount >= 51 && guessCount <= 60) outputText = `Abe ${bhasa} porn dekhne wale aadmi, tu kya ${guessCount} baar gaand mara raha tha be`;
                    else if (guessCount >= 61 && guessCount <= 70) outputText = `Abe ${bhasa} aadmi hai tu ek, ${guessCount} baar kya nasha karke guess kiya`;
                    else if (guessCount >= 71 && guessCount <= 80) outputText = `Waah re kya ${bhasa} gaandu aadmi hai tu, ${guessCount} baar mein guess kar raha hai`;
                    else if (guessCount >= 81 && guessCount <= 90) outputText = `Abe tu ye sab chhod de ${bhasa} Doctor ko dikha, ${guessCount} baar karne se badhiya so ja`;
                    else outputText = `Bhai tu kya maha-chutiya hai re, ${guessCount} baar kaun karta hai, itni baar toh tune hilaya bhi nahi hoga`;
                }

                // UI updates for Win state
                const consoleEl = document.getElementById('outputConsole');
                consoleEl.innerHTML = `
                    <div class="text-center fade-in">
                        <div class="text-emerald-400 font-bold text-xl mb-2">ACCESS GRANTED!</div>
                        <div class="text-emerald-200">${outputText}</div>
                    </div>
                `;
                consoleEl.className = 'terminal-output p-4 rounded-r-lg text-sm sm:text-base flex flex-col justify-center shadow-inner !border-emerald-500 !bg-emerald-900/20';
                
                document.getElementById('inputArea').style.display = 'none';
                document.getElementById('restartBtn').classList.remove('hidden');
            }
        }

        // Helper to output to the HTML console smoothly
        function printToConsole(text) {
            const consoleEl = document.getElementById('outputConsole');
            // Using a wrapper trick to restart CSS animation by replacing content
            consoleEl.innerHTML = `<div class="fade-in">${text}</div>`;
        }

        // Restart Handler
        function resetGame() {
            initGame();
        }

        // Start the game loop on load
        window.onload = initGame;
    </script>
</body>
</html>
